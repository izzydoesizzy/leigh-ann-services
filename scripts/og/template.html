<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Figtree:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }

  /* Teal & Clay (/new) */
  .teal {
    --bg: #FAF7F1; --bg2: #DCEBE6; --ink: #2B241C; --soft: #3D362D; --muted: #7A7268;
    --accent: #2E6B60; --accent2: #C0563B; --line: #E6DFD2; --dark: #2B241C; --on-dark: #FAF7F1;
    --sans: "Figtree", system-ui, sans-serif; --serif: "Fraunces", Georgia, serif;
    --radius: 999px 999px 24px 24px;
  }
  /* Editorial (/) */
  .editorial {
    --bg: #F5F0E6; --bg2: #ECE4D2; --ink: #161513; --soft: #3A3632; --muted: #7A736A;
    --accent: #B8763E; --accent2: #B8763E; --line: #CFC4AE; --dark: #161513; --on-dark: #F5F0E6;
    --sans: "Inter", system-ui, sans-serif; --serif: "Fraunces", Georgia, serif;
    --radius: 24px;
  }

  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.015em; line-height: 1.08; }
  .eyebrow { font-weight: 600; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
  .url { font-size: 20px; color: var(--muted); letter-spacing: 0.02em; }
  .name { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--ink); }
  .portrait { object-fit: cover; object-position: center top; }
  .pill { display: inline-block; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 20px; font-size: 20px; font-weight: 500; color: var(--soft); background: rgba(255,255,255,0.5); }
  .ghost { position: absolute; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0.18; }

  /* 1. Portrait + headline on a colour block */
  .v1 { background: var(--bg); }
  .v1 .block { position: absolute; top: 0; right: 0; bottom: 0; width: 540px; background: var(--bg2); border-radius: 220px 0 0 220px; overflow: hidden; }
  .teal .v1 .block { background: #DCEBE6; }
  .v1 .ring { position: absolute; width: 440px; height: 440px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0.22; right: -60px; top: 50px; }
  .v1 .ring2 { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--accent); opacity: 0.08; right: 420px; bottom: 60px; }
  .v1 .text { position: absolute; left: 80px; top: 92px; width: 560px; }
  .v1 .h { font-size: 58px; margin-top: 22px; }
  .v1 .sub { margin-top: 26px; font-size: 23px; line-height: 1.45; color: var(--soft); }
  .v1 .portrait { position: absolute; right: 100px; top: 74px; width: 360px; height: 482px; border-radius: var(--radius); box-shadow: 0 24px 60px rgba(43,36,28,0.18); }
  .v1 .foot { position: absolute; left: 80px; bottom: 60px; display: flex; gap: 28px; align-items: baseline; }
  .v1 .dash { display: inline-block; width: 48px; height: 5px; background: var(--accent2); border-radius: 3px; margin-right: 16px; vertical-align: middle; }

  /* 2. Type-only statement */
  .v2 { padding: 80px 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .v2 .h { font-size: 78px; max-width: 980px; }
  .v2 .rule { width: 140px; height: 6px; background: var(--accent2); border-radius: 3px; margin-top: 40px; }
  .v2 .foot { display: flex; justify-content: space-between; align-items: baseline; }

  /* 3. Name card */
  .v3 { padding: 88px 96px; display: flex; flex-direction: column; }
  .v3 .big { font-size: 112px; line-height: 1; }
  .v3 .desc { margin-top: 26px; font-family: var(--serif); font-style: italic; font-size: 36px; color: var(--accent); }
  .v3 .pills { margin-top: 56px; display: flex; flex-wrap: wrap; gap: 14px; max-width: 1000px; }
  .v3 .url { position: absolute; right: 96px; bottom: 60px; }

  /* 4. Colour block split */
  .v4 { display: grid; grid-template-columns: 640px 560px; }
  .v4 .left { background: var(--dark); color: var(--on-dark); padding: 80px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .teal .v4 .left { background: #2E6B60; }
  .v4 .left .eyebrow { color: rgba(250,247,241,0.7); }
  .v4 .left .h { font-size: 58px; color: var(--on-dark); margin-top: 24px; }
  .v4 .left .url { color: rgba(250,247,241,0.6); }
  .v4 .portrait { width: 560px; height: 630px; }

  /* 5. Services at a glance */
  .v5 { padding: 72px 88px; display: flex; flex-direction: column; }
  .v5 .h { font-size: 56px; margin-top: 20px; max-width: 980px; }
  .v5 .grid { margin-top: 44px; display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 48px; row-gap: 14px; border-top: 1.5px solid var(--line); padding-top: 28px; }
  .v5 .grid li { list-style: none; font-size: 24px; color: var(--soft); display: flex; gap: 16px; align-items: center; }
  .v5 .grid li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  .v5 .foot { position: absolute; left: 88px; right: 88px; bottom: 52px; display: flex; justify-content: space-between; align-items: baseline; }
</style>
</head>
<body>
<div id="card" class="card"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get("v") || "1";
  const theme = q.get("theme") || "teal";
  const portrait = q.get("portrait");
  const headline = "Reliable operations support, without hiring full-time";
  const sub = "Calendars, inboxes, invoicing, client tracking and simple Google Workspace systems for small businesses.";
  const url = "leighannmartin.com";
  const skills = ["Calendar management", "Inbox management", "Project management", "Invoices, AR and AP tracking", "Client and event folders", "Contracts and follow-ups", "Operations and systems", "Google Workspace workflows"];

  const T = {
    1: `<div class="v1 card">
          <div class="block"><span class="ring"></span></div>
          <span class="ring2"></span>
          <div class="text">
            <p class="eyebrow">Fractional executive operations</p>
            <h1 class="serif h">${headline}</h1>
            <p class="sub">${sub}</p>
          </div>
          <img class="portrait" src="${portrait}" />
          <div class="foot"><span class="dash"></span><span class="name">Leigh-Ann Martin</span></div>
        </div>`,
    2: `<div class="v2 card">
          <span class="ghost" style="width:520px;height:520px;right:-160px;top:-180px"></span>
          <p class="eyebrow">Fractional executive operations</p>
          <div><h1 class="serif h">${headline}</h1><div class="rule"></div></div>
          <div class="foot"><span class="name">Leigh-Ann Martin</span><span class="url">${url}</span></div>
        </div>`,
    3: `<div class="v3 card">
          <h1 class="serif big">Leigh-Ann<br>Martin</h1>
          <p class="desc">Fractional executive operations for small and growing businesses.</p>
          <div class="pills">${["Calendar & inbox", "Invoicing & tracking", "Operations & systems", "Google Workspace"].map(s => `<span class="pill">${s}</span>`).join("")}</div>
          <span class="url">${url}</span>
        </div>`,
    4: `<div class="v4 card">
          <div class="left">
            <div><p class="eyebrow">Fractional executive operations</p><h1 class="serif h">${headline}</h1></div>
            <div><div class="name" style="color:var(--on-dark)">Leigh-Ann Martin</div><div class="url" style="margin-top:6px">${url}</div></div>
          </div>
          <img class="portrait" src="${portrait}" />
        </div>`,
    5: `<div class="v5 card">
          <p class="eyebrow">Leigh-Ann Martin &middot; Fractional executive operations</p>
          <h1 class="serif h">${headline}</h1>
          <ul class="grid">${skills.map(s => `<li>${s}</li>`).join("")}</ul>
          <div class="foot"><span class="url">${url}</span><span class="url">Small &amp; growing businesses</span></div>
        </div>`,
  };
  document.body.className = theme;
  document.getElementById("card").outerHTML = T[v];
</script>
</body>
</html>
